# Patrol four waypoints around a room with two obstacles; battery drains and
# the brain must decide when to break off and recharge.
name = "cyberdyne-01"

[kernel]
mode = "sim"

[world]
width = 10.0
height = 10.0
robot_start = { x = 1.0, y = 1.0, theta = 0.0 }
charger = { x = 0.6, y = 0.6 }
battery_start = 0.6
battery_drain_moving = 0.01
obstacles = [
  { x = 3.0, y = 3.0, w = 1.5, h = 1.0, name = "table" },
  { x = 6.5, y = 5.5, w = 1.0, h = 2.5, name = "shelf" },
]

[brain]
patrol = [
  { x = 8.5, y = 1.5 },
  { x = 8.5, y = 8.5 },
  { x = 1.5, y = 8.5 },
  { x = 5.0, y = 5.0 },
]
battery_low = 0.3
battery_full = 0.9

[safety]
max_linear = 0.8
max_angular = 1.5
keep_out = [ { x = 0.0, y = 8.5, w = 1.0, h = 1.5, name = "stairs" } ]
