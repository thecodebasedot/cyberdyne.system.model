[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberdyne-system-model"
version = "0.1.0"
description = "Layered cognitive robotics platform: kernel, HAL, safety core, world model, memory, cognition, skills."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
llm = ["anthropic>=1.0"]

[project.scripts]
cyberdyne = "cyberdyne.cli:main"

[tool.setuptools.packages.find]
include = ["cyberdyne*"]

[tool.setuptools.package-data]
"cyberdyne.observability" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E731"]
